name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release for
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: Test before releasing
        run: go test ./... -count=1

      - name: Build every platform
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # No cgo, so one Linux runner cross-compiles the lot.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="vinspect_${TAG}_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
              -trimpath -ldflags "-s -w -X main.version=${TAG}" \
              -o "dist/${name}/vinspect${ext}" ./cmd/vinspect
            cp README.md LICENSE "dist/${name}/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "${name}.zip" "$name")
            else
              tar -czf "dist/${name}.tar.gz" -C dist "$name"
            fi
            rm -rf "dist/${name}"
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "vinspect $TAG" \
            --generate-notes \
            --verify-tag
